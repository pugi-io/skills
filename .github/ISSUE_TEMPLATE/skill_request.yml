name: Skill request
description: Suggest a new skill or a change to an existing one.
labels: [skill request]
body:
  - type: textarea
    id: task
    attributes:
      label: What should your agent be able to do with Pugi?
      description: Describe the task in plain words, as you would ask your agent.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The steps you take now in the console, the CLI or elsewhere.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor
        - Other
